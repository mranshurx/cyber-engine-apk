name: Build and Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Build-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-build-tools zipalign apksigner

      - name: Download Apktool
        run: wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Rebuild APK with Apktool
        run: java -jar apktool.jar b . --use-aapt2 -o unaligned.apk

      - name: ZipAlign APK
        run: zipalign -p -f -v 4 unaligned.apk aligned.apk

      # Persistent key: if release.keystore is committed, every build shares
      # ONE signature and you can update in place without uninstalling.
      - name: Prepare Signing Key
        run: |
          if [ ! -f release.keystore ]; then
            echo "No keystore found - generating a new one."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias cyberengine \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mypassword -keypass mypassword \
              -dname "CN=CyberEngine, OU=Dev, O=Cyber, L=City, S=State, C=US"
          else
            echo "Reusing existing release.keystore."
          fi
          echo "--- Certificate fingerprint ---"
          keytool -list -v -keystore release.keystore -storepass mypassword | grep -i "SHA256:" || true

      - name: Sign APK (v1 + v2 + v3)
        run: |
          apksigner sign \
            --ks release.keystore \
            --ks-key-alias cyberengine \
            --ks-pass pass:mypassword \
            --key-pass pass:mypassword \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out CYBER-ENGINE-Signed.apk \
            aligned.apk

      - name: Verify APK Signature
        run: apksigner verify --verbose --print-certs CYBER-ENGINE-Signed.apk

      - name: Report APK Info
        run: |
          ls -lh CYBER-ENGINE-Signed.apk
          echo "--- native libs present ---"
          unzip -l CYBER-ENGINE-Signed.apk | grep '\.so' || true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-ENGINE-Signed-APK
          path: CYBER-ENGINE-Signed.apk
          if-no-files-found: error

      - name: Upload Keystore (commit this once)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: release.keystore
          if-no-files-found: error
