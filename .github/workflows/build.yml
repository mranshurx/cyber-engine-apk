name: Build and Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Files
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download Apktool and Signer
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

    - name: Rebuild APK with Apktool
      run: |
        java -jar apktool.jar b . -o modified_unsigned.apk

    - name: Sign APK with Uber APK Signer
      run: |
        java -jar uber-apk-signer.jar --apks modified_unsigned.apk --out output_apks

    - name: Check Output Files
      run: |
        ls -la output_apks/

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CYBER-ENGINE-Signed-APK
        path: output_apks/*.apk
        if-no-files-found: error
