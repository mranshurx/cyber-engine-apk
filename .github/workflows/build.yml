aname: Build and Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Files
      uses: actions/checkout@v4

    - name: Set up Java & Android SDK Tools
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK Build-Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk-build-tools zipalign apksigner

    - name: Download Apktool
      run: |
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

    - name: Rebuild APK with Apktool
      run: |
        java -jar apktool.jar b . --use-aapt2 -o unaligned.apk

    - name: ZipAlign APK
      run: |
        zipalign -v 4 unaligned.apk aligned.apk

    - name: Generate Signing Key
      run: |
        keytool -genkey -v -keystore release.keystore -alias my-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword -keypass mypassword -dname "CN=CyberEngine, OU=Dev, O=Cyber, L=City, S=State, C=US"

    - name: Sign APK with apksigner
      run: |
        apksigner sign --ks release.keystore --ks-pass pass:mypassword --key-pass pass:mypassword --out CYBER-ENGINE-Signed.apk aligned.apk

    - name: Verify APK Signature
      run: |
        apksigner verify --verbose CYBER-ENGINE-Signed.apk

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CYBER-ENGINE-Signed-APK
        path: CYBER-ENGINE-Signed.apk
        if-no-files-found: error
