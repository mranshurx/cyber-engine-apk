- name: Prepare signing key
        run: |
          if [ -f release.keystore ] && \
             keytool -list -keystore release.keystore -storepass mypassword >/dev/null 2>&1; then
            echo "Keystore OK - reusing committed key."
          else
            if [ -f release.keystore ]; then
              echo "::warning::release.keystore exists but cannot be opened. Diagnostics:"
              ls -l release.keystore
              file release.keystore
              head -c 60 release.keystore | tr -d '\0' | head -1
            else
              echo "::warning::No keystore committed - generating a throwaway key."
            fi
            rm -f release.keystore
            keytool -genkeypair -v -noprompt \
              -keystore release.keystore -storetype PKCS12 \
              -alias cyberengine -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mypassword -keypass mypassword \
              -dname "CN=CyberEngine,OU=Dev,O=Cyber,L=City,ST=State,C=US"
          fi
          echo "--- Certificate fingerprint ---"
          keytool -list -v -keystore release.keystore -storepass mypassword \
            | grep -i "SHA256:" || true
